name: Unity bridge tooling tests
on:
  push:
    branches: [main]
    paths:
      - 'unity/Tools/**'
      - '.github/workflows/unity-bridge-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate inventory signature tests
        run: python -m unittest discover -s unity/Tools/tests -v
