name: Game runner Windows build

on:
  push:
    branches: [main]
    paths:
      - 'drecom/PS2Recomp/ps2xRuntime/**'
      - 'drecom/PS2Recomp/ps2xIOP/**'
      - 'drecom/Game/Recompiled/output/**'
      - 'drecom/PS2Recomp/tools/Run-DRECOM-Diagnostics.*'
      - '.github/workflows/game-runner-windows.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  windows-game-runner:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Inspect and stage recompiled game sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'drecom/Game/Recompiled/output'
          $runtime = 'drecom/PS2Recomp/ps2xRuntime'
          $cpp = @(Get-ChildItem $source -Filter '*.cpp' -File)
          Write-Host "Generated game .cpp files: $($cpp.Count)"
          if ($cpp.Count -eq 0) { throw 'No recompiled game .cpp sources were found' }
          foreach ($header in @('ps2_recompiled_functions.h', 'ps2_recompiled_stubs.h')) {
            $candidate = Join-Path $source $header
            if (-not (Test-Path $candidate)) { throw "Required header missing: $candidate" }
            Copy-Item $candidate (Join-Path $runtime 'include') -Force
          }
          $dest = Join-Path $runtime 'src/runner'
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          foreach ($file in $cpp) { Copy-Item $file.FullName $dest -Force }
          Write-Host "Runner sources staged at $dest"
      - name: Configure runtime for Windows
        shell: pwsh
        run: |
          cmake -S drecom/PS2Recomp -B build-game -DPS2X_BUILD_RECOMP=OFF -DPS2X_BUILD_ANALYZER=OFF -DPS2X_BUILD_TEST=OFF -DPS2X_BUILD_STUDIO=OFF -DPS2X_ENABLE_FFMPEG=OFF -DPS2X_ENABLE_DEBUG_UI=OFF -DPS2X_ENABLE_RUNNER_UNITY_BUILD=ON -DPS2X_ENABLE_RUNNER_PCH=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build game runner
        shell: pwsh
        run: |
          cmake --build build-game --config Release --target ps2EntryRunner --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate diagnostic launcher syntax
        shell: pwsh
        run: |
          $script = 'drecom/PS2Recomp/tools/Run-DRECOM-Diagnostics.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell diagnostic launcher has syntax errors'
          }
          Write-Host 'Diagnostic launcher syntax valid'
      - name: Prepare executable
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem build-game -Filter 'ps2EntryRunner.exe' -Recurse -File)
          if ($exe.Count -eq 0) { throw 'Build succeeded without producing ps2EntryRunner.exe' }
          New-Item dist -ItemType Directory -Force | Out-Null
          Copy-Item $exe[0].FullName dist/ps2EntryRunner.exe -Force
          Copy-Item drecom/PS2Recomp/tools/Run-DRECOM-Diagnostics.ps1 dist/Run-DRECOM-Diagnostics.ps1 -Force
          Copy-Item drecom/PS2Recomp/tools/Run-DRECOM-Diagnostics.cmd dist/Run-DRECOM-Diagnostics.cmd -Force
          Write-Host "Built executable: $($exe[0].FullName)"
          Write-Host "Diagnostic launcher packaged beside executable"
      - name: Upload game runner executable
        uses: actions/upload-artifact@v6
        with:
          name: drecom-ps2-entry-runner-windows
          path: |
            dist/ps2EntryRunner.exe
            dist/Run-DRECOM-Diagnostics.ps1
            dist/Run-DRECOM-Diagnostics.cmd
          if-no-files-found: error
      - name: Publish build status to the main commit
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $outcome = if ('${{ job.status }}' -eq 'success') { 'success' } else { 'failure' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f "state=$outcome" -f "context=game-runner/windows-build" -f "description=Windows runner build and artifact upload: $outcome" -f "target_url=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
